<!DOCTYPE html>
<html lang="en" data-theme="dark">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Notes+</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <div id="app">
      <header class="titlebar" id="titlebar">
        <div class="app-icon" title="Notes+" aria-hidden="true">
          <svg viewBox="0 0 16 16" width="16" height="16">
            <rect x="2.5" y="1.5" width="11" height="13" rx="1.2" fill="#4CC2FF" />
            <path d="M10 1.5h2.2c.6 0 1 .4 1 1V5L10 1.5z" fill="#9AE2FF" />
            <rect x="4.4" y="6.2" width="7.2" height="1.05" rx=".4" fill="#0A2A3A" opacity=".55" />
            <rect x="4.4" y="8.3" width="7.2" height="1.05" rx=".4" fill="#0A2A3A" opacity=".55" />
            <rect x="4.4" y="10.4" width="5" height="1.05" rx=".4" fill="#0A2A3A" opacity=".55" />
          </svg>
        </div>
        <div class="tabstrip" id="tabstrip"></div>
        <button class="icon-btn tab-add" id="new-tab" title="New tab" aria-label="New tab">
          <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
        </button>
        <div class="titlebar-drag"></div>
      </header>

      <div class="commandbar" id="commandbar">
        <nav class="menubar" id="menubar">
          <button class="menu-trigger" data-menu="file">File</button>
          <button class="menu-trigger" data-menu="edit">Edit</button>
          <button class="menu-trigger" data-menu="view">View</button>
        </nav>

        <div class="format-toolbar" id="format-toolbar">
          <label class="style-select-wrap">
            <select id="style-select" title="Style" aria-label="Style">
              <option value="paragraph">Text</option>
              <option value="1">Heading 1</option>
              <option value="2">Heading 2</option>
              <option value="3">Heading 3</option>
              <option value="4">Heading 4</option>
              <option value="5">Heading 5</option>
              <option value="6">Heading 6</option>
            </select>
          </label>
          <button class="icon-btn" id="fmt-bold" title="Bold (Ctrl+B)" aria-label="Bold"><strong>B</strong></button>
          <button class="icon-btn" id="fmt-italic" title="Italic (Ctrl+I)" aria-label="Italic"><em>I</em></button>
          <button class="icon-btn" id="fmt-strike" title="Strikethrough" aria-label="Strikethrough"><s>S</s></button>
          <button class="icon-btn" id="fmt-link" title="Link (Ctrl+K)" aria-label="Link">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M6.2 8.6a3 3 0 0 0 4.3.3l1.8-1.8a3 3 0 0 0-4.2-4.2L7.2 4" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/><path d="M9.8 7.4a3 3 0 0 0-4.3-.3L3.7 8.9a3 3 0 0 0 4.2 4.2l.9-1.1" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="fmt-bullet" title="Bulleted list" aria-label="Bulleted list">
            <svg viewBox="0 0 16 16" width="14" height="14"><circle cx="3.2" cy="4" r="1.1" fill="currentColor"/><circle cx="3.2" cy="8" r="1.1" fill="currentColor"/><circle cx="3.2" cy="12" r="1.1" fill="currentColor"/><path d="M6.2 4h7M6.2 8h7M6.2 12h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="fmt-number" title="Numbered list" aria-label="Numbered list">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M2.4 3.2h2.2M3.5 3.2v4.2M2.4 7.4h2.2M2.4 10.4h2.4l-2.4 2.2h2.4" fill="none" stroke="currentColor" stroke-width="1.15" stroke-linecap="round" stroke-linejoin="round"/><path d="M6.6 4h7M6.6 8h7M6.6 12h7" stroke="currentColor" stroke-width="1.3" stroke-linecap="round"/></svg>
          </button>
          <button class="icon-btn" id="fmt-clear" title="Clear formatting" aria-label="Clear formatting">
            <svg viewBox="0 0 16 16" width="14" height="14"><path d="M3 4h10M6.2 4 5 13h2.1l.3-2.2h2.2L10 13h2.1L10.8 4" fill="none" stroke="currentColor" stroke-width="1.25" stroke-linecap="round" stroke-linejoin="round"/><path d="M2.5 13.2 13.5 2.8" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/></svg>
          </button>
        </div>

        <div class="command-end">
          <button class="icon-btn" id="open-blank" title="Tasks" aria-label="Tasks">
            <svg viewBox="0 0 16 16" width="14" height="14" fill="none">
              <path d="M11.6 2.4a1.3 1.3 0 0 1 1.9 1.8L6.2 11.5 3.5 12.4l.9-2.7 7.2-7.3z" stroke="currentColor" stroke-width="1.25" stroke-linejoin="round"/>
              <path d="M10.4 3.6 12.3 5.5" stroke="currentColor" stroke-width="1.25" stroke-linecap="round"/>
            </svg>
          </button>
          <button class="icon-btn" id="open-settings" title="Settings" aria-label="Settings">
            <span class="fluent-icon" aria-hidden="true">&#xE713;</span>
          </button>
        </div>
      </div>

      <main class="workspace">
        <section class="editor-page" id="editor-page">
          <div class="editor-wrap" id="editor-wrap">
            <div id="formatted-editor" class="formatted-editor"></div>
            <textarea id="syntax-editor" class="syntax-editor" spellcheck="true" hidden></textarea>
          </div>
          <aside class="find-flyout" id="find-flyout" hidden>
            <div class="find-row">
              <input id="find-input" type="text" placeholder="Find" autocomplete="off" />
              <button class="icon-btn" id="find-prev" title="Previous">
                <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 10 8 5l4 5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn" id="find-next" title="Next">
                <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 6l4 5 4-5" fill="none" stroke="currentColor" stroke-width="1.4" stroke-linecap="round" stroke-linejoin="round"/></svg>
              </button>
              <button class="icon-btn" id="find-close" title="Close">
                <svg viewBox="0 0 16 16" width="12" height="12"><path d="M4 4l8 8M12 4l-8 8" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
              </button>
            </div>
            <div class="find-row" id="replace-row" hidden>
              <input id="replace-input" type="text" placeholder="Replace" autocomplete="off" />
              <button class="text-btn" id="replace-one">Replace</button>
              <button class="text-btn" id="replace-all">All</button>
            </div>
            <div class="find-options">
              <label><input type="checkbox" id="find-case" /> Match case</label>
              <label><input type="checkbox" id="find-wrap" checked /> Wrap around</label>
              <label><input type="checkbox" id="find-regex" /> Regular expression</label>
            </div>
          </aside>
        </section>

        <section class="settings-page" id="settings-page" hidden>
          <header class="settings-header">
            <button class="icon-btn" id="settings-back" title="Back" aria-label="Back">
              <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1>Settings</h1>
          </header>
          <div class="settings-body">
            <details class="settings-group" open>
              <summary>App theme</summary>
              <div class="settings-fields">
                <label class="radio"><input type="radio" name="theme" value="light" /> Light</label>
                <label class="radio"><input type="radio" name="theme" value="dark" /> Dark</label>
                <label class="radio"><input type="radio" name="theme" value="system" /> Use system setting</label>
              </div>
            </details>
            <details class="settings-group" open>
              <summary>Font</summary>
              <div class="settings-fields font-row">
                <label>Family
                  <select id="font-family">
                    <option>Consolas</option>
                    <option>Cascadia Mono</option>
                    <option>Cascadia Code</option>
                    <option>Courier New</option>
                    <option>Lucida Console</option>
                    <option>Segoe UI</option>
                    <option>Segoe UI Variable</option>
                    <option>Calibri</option>
                    <option>Arial</option>
                    <option>Times New Roman</option>
                  </select>
                </label>
                <label>Size
                  <select id="font-size">
                    <option>8</option><option>9</option><option>10</option>
                    <option selected>11</option>
                    <option>12</option><option>14</option><option>16</option>
                    <option>18</option><option>20</option><option>22</option>
                    <option>24</option><option>26</option><option>28</option>
                    <option>36</option><option>48</option><option>72</option>
                  </select>
                </label>
              </div>
            </details>
            <details class="settings-group">
              <summary>Opening files</summary>
              <div class="settings-fields">
                <label class="radio"><input type="radio" name="opening" value="autodetect" /> Autodetect</label>
                <label class="radio"><input type="radio" name="opening" value="utf8" /> UTF-8</label>
              </div>
            </details>
            <details class="settings-group">
              <summary>When Notes+ starts</summary>
              <div class="settings-fields">
                <label class="radio"><input type="radio" name="startup" value="session" /> Continue previous session</label>
                <label class="radio"><input type="radio" name="startup" value="new" /> Start new session and discard unsaved changes</label>
              </div>
            </details>
            <details class="settings-group">
              <summary>Formatting</summary>
              <div class="settings-fields">
                <label class="check"><input type="checkbox" id="setting-formatting" /> Enable text formatting</label>
                <label class="check"><input type="checkbox" id="setting-wrap" /> Word wrap</label>
              </div>
            </details>
          </div>
        </section>

        <section class="blank-page" id="blank-page" hidden>
          <header class="settings-header">
            <button class="icon-btn" id="blank-back" title="Back" aria-label="Back">
              <svg viewBox="0 0 16 16" width="16" height="16"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>
            <h1>Tasks</h1>
          </header>
          <form class="task-composer" id="task-composer">
            <button type="submit" class="icon-btn" id="task-add" title="Add task" aria-label="Add task">
              <svg viewBox="0 0 16 16" width="12" height="12"><path d="M8 2.5v11M2.5 8h11" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>
            </button>
            <input id="task-input" type="text" placeholder="Add a task" autocomplete="off" maxlength="240" />
          </form>
          <div class="task-list" id="task-list"></div>
        </section>
      </main>

      <footer class="statusbar" id="statusbar">
        <button class="status-item" id="status-cursor">Ln 1, Col 1</button>
        <div class="status-spacer"></div>
        <button class="status-item" id="status-zoom">100%</button>
        <button class="status-item" id="status-eol">Windows (CRLF)</button>
        <button class="status-item" id="status-enc">UTF-8</button>
        <button class="status-item" id="status-view">Formatted</button>
      </footer>
    </div>

    <div class="menu-layer" id="menu-layer" hidden></div>
    <div class="dialog-layer" id="dialog-layer" hidden></div>

    <script type="module" src="./main.js"></script>
  </body>
</html>
